<form id="sqlb-form">
  <label>SQL<br>
    <textarea id="sqlb-input" rows="10" placeholder="SELECT * FROM users WHERE id = 1;"></textarea>
  </label>

  <div id="sqlb-options">
    <label>Dialect
      <select id="sqlb-language">
        <option value="sql">SQL</option>
        <option value="mysql" selected>MySQL</option>
        <option value="postgresql">PostgreSQL</option>
        <option value="tsql">T-SQL (SQL Server)</option>
        <option value="plsql">PL/SQL (Oracle)</option>
        <option value="sqlite">SQLite</option>
        <option value="mariadb">MariaDB</option>
        <option value="db2">DB2</option>
        <option value="bigquery">BigQuery</option>
      </select>
    </label>
    <label>Indent
      <select id="sqlb-indent">
        <option value="2">2 spaces</option>
        <option value="3">3 spaces</option>
        <option value="4" selected>4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </label>
    <label>Keywords
      <select id="sqlb-case">
        <option value="upper" selected>UPPER</option>
        <option value="lower">lower</option>
        <option value="preserve">preserve</option>
      </select>
    </label>
  </div>

  <button type="button" id="sqlb-btn">Format</button>
</form>

<div id="sqlb-output-wrap" hidden>
  <div id="sqlb-output-bar">
    <span>Result</span>
    <button type="button" id="sqlb-copy">Copy</button>
  </div>
  <textarea id="sqlb-output" readonly rows="14" spellcheck="false"></textarea>
</div>

<p id="sqlb-status"></p>
