<form id="ping-form">
  <div class="ping-row">
    <label class="ping-host-label">Host or IP<br>
      <input type="text" id="ping-host" placeholder="google.com or 8.8.8.8" spellcheck="false" autocomplete="off">
    </label>
    <label>Count<br>
      <select id="ping-count">
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="16">16</option>
      </select>
    </label>
  </div>
  <div class="ping-actions">
    <button type="submit" id="ping-submit">Ping</button>
    <button type="button" id="ping-stop" hidden>Stop</button>
  </div>
</form>
<p id="ping-status"></p>
<div id="ping-output" hidden>
  <pre id="ping-pre"></pre>
</div>
