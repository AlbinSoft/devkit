<form id="htpasswd-form">
  <label>.htpasswd file path<br>
    <input type="text" id="htpasswd-path" placeholder="/var/www/html/.htpasswd" spellcheck="false">
  </label>
  <label>Auth name (realm)<br>
    <input type="text" id="htpasswd-realm" value="Restricted" spellcheck="false">
  </label>
  <label>Username<br>
    <input type="text" id="htpasswd-user" autocomplete="off" spellcheck="false">
  </label>
  <label>Password<br>
    <input type="password" id="htpasswd-pass" autocomplete="new-password">
  </label>
  <button type="submit">Generate</button>
</form>
<p id="htpasswd-status"></p>
<div id="htpasswd-output" hidden>
  <section>
    <h2>.htaccess</h2>
    <textarea id="htpasswd-htaccess" readonly rows="5" spellcheck="false"></textarea>
    <div class="htpasswd-btn-row">
      <button type="button" id="htpasswd-copy-hta">Copy</button>
    </div>
  </section>
  <section>
    <h2>.htpasswd</h2>
    <textarea id="htpasswd-htpasswd" readonly rows="2" spellcheck="false"></textarea>
    <div class="htpasswd-btn-row">
      <button type="button" id="htpasswd-copy-htp">Copy</button>
    </div>
  </section>
</div>
