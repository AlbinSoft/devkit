<div id="hv-wrap">
  <label id="hv-drop">
    <input type="file" id="hv-file">
    <span id="hv-drop-label">Drop a binary file here or click to open</span>
  </label>
  <p id="hv-msg" hidden></p>
  <div id="hv-viewer" hidden>
    <div id="hv-head"></div>
    <div id="hv-scroll">
      <div id="hv-space"></div>
      <div id="hv-canvas"></div>
    </div>
    <div id="hv-bar">
      <span id="hv-status"></span>
      <button type="button" id="hv-close">Close</button>
    </div>
  </div>
</div>
