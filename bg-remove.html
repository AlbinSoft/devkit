<label id="bgr-dropzone">
  <input type="file" id="bgr-input" accept="image/jpeg,image/png,image/webp" multiple>
  <span id="bgr-drop-label">Drop images here or click to select</span>
</label>
<p id="bgr-status"></p>
<section id="bgr-controls" hidden>
  <h2>Options</h2>
  <label id="bgr-model-wrap">
    Model
    <select id="bgr-model">
      <option value="isnet-general-use">General use (default)</option>
      <option value="birefnet-general">Metallic / reflective objects</option>
      <option value="u2net">u2net</option>
    </select>
  </label>
  <button type="button" id="bgr-remove">Remove background</button>
</section>
<section id="bgr-results" hidden>
  <h2>Results</h2>
  <div id="bgr-list"></div>
</section>
