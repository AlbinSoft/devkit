<form id="pwgen-form">
  <div class="pwgen-row">
    <label>Length<br><select id="pwgen-length"></select></label>
    <label>Quantity<br><select id="pwgen-count"></select></label>
  </div>
  <fieldset class="pwgen-sets">
    <legend>Character sets</legend>
    <label class="pwgen-chk"><input type="checkbox" id="pwgen-upper" checked> Uppercase (A–Z)</label>
    <label class="pwgen-chk"><input type="checkbox" id="pwgen-lower" checked> Lowercase (a–z)</label>
    <label class="pwgen-chk"><input type="checkbox" id="pwgen-digits" checked> Digits (0–9)</label>
    <label class="pwgen-chk"><input type="checkbox" id="pwgen-symbols"> Symbols (!@#$…)</label>
  </fieldset>
  <label class="pwgen-chk"><input type="checkbox" id="pwgen-noambig"> Exclude ambiguous characters (0, O, I, l, 1)</label>
  <button type="submit">Generate</button>
</form>
<p id="pwgen-error" hidden></p>
<output id="pwgen-output" hidden>
  <div class="pwgen-strength">
    <div class="pwgen-bar"><div id="pwgen-bar-fill"></div></div>
    <span id="pwgen-strength-meta"></span>
  </div>
  <ul id="pwgen-list"></ul>
</output>
