<div id="mdv-wrap">
  <label id="mdv-drop">
    <input type="file" id="mdv-file" accept="image/jpeg,image/png,image/webp,image/tiff">
    <span id="mdv-drop-label">Drop an image here or click to open</span>
  </label>
  <p id="mdv-msg" hidden></p>
  <div id="mdv-result" hidden>
    <div id="mdv-top">
      <img id="mdv-preview" alt="Preview" hidden>
      <p id="mdv-gps-warning" class="mdv-warning" hidden></p>
    </div>
    <div id="mdv-sections"></div>
    <div id="mdv-actions">
      <button type="button" id="mdv-copy">Copy as JSON</button>
      <button type="button" id="mdv-close">Close</button>
    </div>
  </div>
</div>
