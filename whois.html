<form id="whois-form">
  <label class="whois-query-label">Domain or IP<br>
    <input type="text" id="whois-query" placeholder="google.com or 8.8.8.8" spellcheck="false" autocomplete="off">
  </label>
  <button type="submit" id="whois-submit">Whois</button>
</form>
<p id="whois-status"></p>
<div id="whois-output" hidden>
  <p id="whois-server"></p>
  <pre id="whois-pre"></pre>
</div>
